<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Mundial — Mapa colaborativo</title>

<style>
:root{--blue:#1769aa;--ink:#1e293b;--muted:#64748b;--paper:#f5f8fb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
header{background:#123b5d;color:#fff;padding:20px clamp(16px,4vw,48px)}
header h1{margin:0 0 6px;font-size:clamp(1.4rem,3vw,2rem)}
header p{margin:0;color:#d9e8f5}
.wrap{max-width:1400px;margin:auto;padding:18px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:210px;padding:11px 13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}
.hint{color:var(--muted);font-size:.92rem}
#map{height:min(68vh,720px);min-height:420px;border-radius:16px;border:1px solid #d7e1ea;box-shadow:0 5px 20px #0f172a10;background:#dcecf3}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 2px;color:var(--muted);font-size:.9rem}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;background:#2b8a5a}
.dot.no-work{background:#dce8ef;border:1px solid #8296a8}
.modal{position:fixed;inset:0;background:#0f172ab8;display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}
.modal.open{display:flex}
.dialog{background:white;border-radius:16px;width:min(920px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 70px #0005}
.dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:start;padding:18px 20px;border-bottom:1px solid #e2e8f0}
.dialog-head h2{margin:0}
.close{border:0;background:#edf2f7;border-radius:8px;padding:8px 12px;font-size:1.2rem;cursor:pointer}
.content{padding:18px 20px}
.work{border:1px solid #dbe4ec;border-radius:12px;padding:14px;margin:12px 0}
.work h3{margin:0 0 4px;font-size:1rem;overflow-wrap:anywhere}
.work p{margin:0 0 10px;color:var(--muted);font-size:.9rem}
.preview{max-width:100%;max-height:65vh;display:block;margin:10px auto;border-radius:8px}
.empty{padding:22px;border-radius:10px;background:#f1f5f9;color:#475569}
.small{font-size:.85rem;color:var(--muted)}
a{color:var(--blue)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:16px}
@media(max-width:600px){.wrap{padding:10px}#map{min-height:390px}.dialog-head,.content{padding:14px}}
</style>
</head>

<body>
<header>
  <h1>Atlas Mundial — Mapa colaborativo</h1>
  <p>Clique em um país para consultar os trabalhos enviados pela turma.</p>
</header>

<main class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar país em português…" aria-label="Buscar país">
    <span class="hint" id="status">Carregando mapa…</span>
  </div>

  <div id="map" role="application" aria-label="Mapa-múndi interativo"></div>

  <div class="legend">
    <span><i class="dot"></i> País com trabalho enviado</span>
    <span><i class="dot no-work"></i> Sem trabalho cadastrado</span>
    <span>Selecione um país para abrir os documentos.</span>
  </div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="countryTitle">
  <section class="dialog">
    <div class="dialog-head">
      <div>
        <h2 id="countryTitle">País</h2>
        <div class="small" id="workCount"></div>
      </div>
      <button class="close" id="close" aria-label="Fechar">×</button>
    </div>
    <div class="content" id="works"></div>
  </section>
</div>

<footer>Atlas Mundial • atividade escolar</footer>

const aliasMap = {};
Object.entries(aliases).forEach(([key,value]) => {
  aliasMap[norm(key)] = value;
});

// Extrai código numérico quando disponível.
function getNumericCode(feature) {
  const p = feature.properties || {};
  const candidates = [
    p.ISO_N3, p.ISO_N3_EH, p.iso_n3, p.ADM0_A3,
    p.ISO_A3, p.ISO_A3_EH
  ];

  for (const value of candidates) {
    if (value == null) continue;
    const s = String(value).trim();
    if (/^\d{1,3}$/.test(s)) {
      const code = s.padStart(3,"0");
      if (countryByCode[code]) return code;
    }
  }
  return null;
}

// Converte o nome da feição para o nome usado no formulário.
function propsName(feature) {
  const p = feature.properties || {};
  const code = getNumericCode(feature);
  if (code && countryByCode[code]) return countryByCode[code];

  const possibleNames = [
    p.ADMIN, p.name, p.name_en, p.NAME, p.NAME_EN,
    p.name_long, p.FORMAL_EN, p.SOVEREIGNT, p.GEOUNIT
  ].filter(Boolean);

  for (const candidate of possibleNames) {
    const translated = aliasMap[norm(candidate)];
    if (translated) return translated;
  }

  return possibleNames[0] || "País";
}

// Faz a correspondência entre os países do mapa e os nomes da planilha.
function getWorks(country) {
  const wanted = norm(country);
  const keys = Object.keys(worksByCountry);

  const exact = keys.find(key => norm(key) === wanted);
  if (exact) return worksByCountry[exact] || [];

  const translatedWanted = aliasMap[wanted];
  if (translatedWanted) {
    const match = keys.find(key => norm(key) === norm(translatedWanted));
    if (match) return worksByCountry[match] || [];
  }

  const reverseMatch = keys.find(key =>
    norm(aliasMap[norm(key)] || "") === wanted
  );

  return reverseMatch ? (worksByCountry[reverseMatch] || []) : [];
}

function style(feature) {
  const name = propsName(feature);
  const hasWork = getWorks(name).length > 0;
  return {
    color: hasWork ? "#226c49" : "#8296a8",
    weight: hasWork ? 1.3 : 0.7,
    fillColor: hasWork ? "#55a879" : "#dce8ef",
    fillOpacity: hasWork ? 0.95 : 0.85
  };
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

// Converte links usuais do Drive para pré-visualização de imagem.
function imagePreviewUrl(url) {
  const text = String(url || "");
  const match = text.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)
    || text.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (match) {
    return "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(match[1]) + "&sz=w1000";
  }
  return text;
}

// Cria um endereço de pré-visualização para vídeos armazenados no Google Drive.
function drivePreviewUrl(url, autoplay) {
  const text = String(url || "");
  const match = text.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)
    || text.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (!match) return "";
  return "https://drive.google.com/file/d/" + encodeURIComponent(match[1]) +
    "/preview" + (autoplay ? "?autoplay=1" : "");
}

function showCountry(name, layer) {
  const list = getWorks(name);
  // Se houver vídeo, ele aparece primeiro e tenta iniciar automaticamente.
  const orderedList = [...list].sort((a, b) => {
    const aVideo = String(a.mimeType || "").startsWith("video/") ? 1 : 0;
    const bVideo = String(b.mimeType || "").startsWith("video/") ? 1 : 0;
    return bVideo - aVideo;
  });

  document.getElementById("countryTitle").textContent = name;
  document.getElementById("workCount").textContent = list.length
    ? `${list.length} trabalho(s) enviado(s)`
    : "Nenhum trabalho registrado ainda";

  const el = document.getElementById("works");
  el.innerHTML = "";

  if (!orderedList.length) {
    el.innerHTML = '<div class="empty">Ainda não há trabalhos cadastrados para este país. Volte depois!</div>';
  } else {
    let videoAutoplayUsed = false;

    orderedList.forEach(work => {
      const card = document.createElement("article");
      card.className = "work";

      const title = document.createElement("h3");
      title.textContent = work.filename || "Trabalho enviado";

      const p = document.createElement("p");
      p.textContent = work.date ? "Data do envio: " + work.date : "Trabalho enviado";
      card.append(title, p);

      const isVideo = String(work.mimeType || "").startsWith("video/");
      const isFirstVideo = isVideo && !videoAutoplayUsed;

      if (isVideo && work.url) {
        videoAutoplayUsed = true;
        const driveEmbed = drivePreviewUrl(work.url, isFirstVideo);

        if (driveEmbed) {
          const frame = document.createElement("iframe");
          frame.src = driveEmbed;
          frame.title = "Vídeo enviado para " + name;
          frame.style.width = "100%";
          frame.style.aspectRatio = "16 / 9";
          frame.style.minHeight = "240px";
          frame.style.border = "0";
          frame.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
          frame.allowFullscreen = true;
          frame.loading = isFirstVideo ? "eager" : "lazy";
          card.append(frame);
        } else {
          const video = document.createElement("video");
          video.src = work.url;
          video.controls = true;
          video.autoplay = isFirstVideo;
          video.muted = isFirstVideo;
          video.playsInline = true;
          video.style.width = "100%";
          video.style.maxHeight = "65vh";
          card.append(video);
          if (isFirstVideo) {
            const note = document.createElement("p");
            note.className = "small";
            note.textContent = "O vídeo tenta iniciar automaticamente; se não iniciar, pressione reproduzir.";
            card.append(note);
          }
        }
      } else if (work.mimeType && work.mimeType.startsWith("image/") && work.url) {
        const link = document.createElement("a");
        link.href = work.url;
        link.target = "_blank";
        link.rel = "noopener";

        const img = document.createElement("img");
        img.className = "preview";
        img.src = imagePreviewUrl(work.url);
        img.alt = "Prévia do trabalho enviado";
        img.loading = "lazy";
        img.onerror = () => { img.style.display = "none"; };

        link.append(img);
        card.append(link);
      }

      const a = document.createElement("a");
      a.href = work.url || "#";
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = isVideo ? "Abrir vídeo em outra aba ↗" :
        work.mimeType === "application/pdf" ? "Abrir PDF ↗" : "Abrir arquivo ↗";

      card.append(a);
      el.append(card);
    });
  }

  document.getElementById("modal").classList.add("open");
  selectedLayer = layer || selectedLayer;
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
}

document.getElementById("close").onclick = closeModal;

document.getElementById("modal").onclick = event => {
  if (event.target.id === "modal") closeModal();
};

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

function loadWorks() {
  const callbackName = "atlasWorksCallback";

  window[callbackName] = data => {
    try {
      worksByCountry = data && data.works ? data.works : {};

      if (countryLayer) {
        countryLayer.setStyle(style);
        countryLayer.eachLayer(layer => {
          layer.unbindTooltip();
          layer.bindTooltip(propsName(layer.feature));
        });
      }

      setStatus("Trabalhos carregados");
    } catch (error) {
      setStatus("Erro ao atualizar os trabalhos");
      console.error(error);
    } finally {
      delete window[callbackName];
      const script = document.getElementById("works-script");
      if (script) script.remove();
    }
  };

  const script = document.createElement("script");
  script.id = "works-script";
  script.src = API_URL + "?action=list&callback=" +
    callbackName + "&_=" + Date.now();

  script.onerror = () => {
    setStatus("Não foi possível carregar os trabalhos");
    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}

fetch(GEOJSON_URL)
  .then(response => {
    if (!response.ok) throw new Error("Falha ao carregar o mapa");
    return response.json();
  })
  .then(data => {
    countryFeatures = data.features || [];

    countryLayer = L.geoJSON(data, {
      style,
      onEachFeature: (feature, layer) => {
        const name = propsName(feature);
        layer.bindTooltip(name);

        layer.on({
          mouseover: event => {
            event.target.setStyle({
              weight: 1.8,
              color: "#244c69",
              fillOpacity: 1
            });
            event.target.bringToFront();
          },
          mouseout: event => {
            countryLayer.resetStyle(event.target);
          },
          click: event => {
            showCountry(name, event.target);
          }
        });
      }
    }).addTo(map);

    setStatus("Mapa pronto • carregando trabalhos…");
    loadWorks();
  })
  .catch(error => {
    setStatus("Falha ao carregar o mapa. Verifique sua conexão.");
    console.error(error);
  });

// Busca pelo nome em português. Pressione Enter ou clique no resultado do mapa.
document.getElementById("search").addEventListener("keydown", event => {
  if (event.key !== "Enter") return;

  const query = norm(event.target.value);
  if (!query || !countryLayer) return;

  const found = countryFeatures.find(feature =>
    norm(propsName(feature)).includes(query)
  );

  if (found) {
    const layer = countryLayer.getLayers().find(item => item.feature === found);
    if (layer) {
      map.fitBounds(layer.getBounds(), {maxZoom:5});
      showCountry(propsName(found), layer);
    }
  } else {
    setStatus("País não encontrado. Confira a grafia.");
  }
});
</script>
